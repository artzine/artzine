name: Publish package candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact coordinated package version
        required: true
        type: string
      action:
        description: candidate publishes under next; promote moves latest after acceptance
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - promote
permissions:
  contents: read
concurrency:
  group: package-distribution
  cancel-in-progress: false
jobs:
  distribute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - run: npm install --global pnpm@10.33.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - name: Check requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; assert.equal(JSON.parse(readFileSync(".artifacts/release/manifest.json")).version, process.env.RELEASE_VERSION);'
      # Trusted publishing for publish and dist-tag needs npm 11.21 or later;
      # the tarballs above were packed by the pinned Node and pnpm.
      - run: npm install --global npm@11.21.1
      - if: inputs.action == 'candidate'
        run: pnpm release:candidate
      - run: pnpm release:verify
      - if: inputs.action == 'promote'
        run: pnpm release:promote
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-${{ inputs.action }}
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
